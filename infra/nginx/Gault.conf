# Самостоятельный статический шифратор Gault без кабинета и API.
# Файл подключается внутри http {} после выпуска сертификата gault.ru.
# На общем сервере используйте поздний include (например sites-enabled/zz-Gault),
# чтобы сохранить существующий TLS-vhost по умолчанию.
map $uri $gault_cipher_csp {
    default "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' blob:; font-src 'self'; connect-src 'none'; worker-src 'self'; manifest-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'";
    /sw.js "default-src 'none'; script-src 'self'; connect-src 'self'; object-src 'none'";
}
map $uri $gault_static_cache {
    default no-cache;
    ~^/assets/ "public, max-age=31536000, immutable";
}
map $uri $gault_sw_scope {
    default "";
    /sw.js /;
}

# Отложенный кабинет не обслуживает приложение, даже если DNS-запись уже добавлена.
server {
    listen 80;
    listen [::]:80;
    server_name account.gault.ru;
    access_log off;
    return 404;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name gault.ru;
    access_log off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/gault-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        return 301 https://gault.ru$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name gault.ru;
    root /var/www/Gault/cipher;
    index index.html;
    access_log off;
    error_log /var/log/nginx/Gault-error.log warn;

    ssl_certificate /etc/letsencrypt-gault/live/gault.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt-gault/live/gault.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:GaultSSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy $gault_cipher_csp always;
    add_header X-Frame-Options DENY always;
    add_header Cache-Control $gault_static_cache always;
    add_header Service-Worker-Allowed $gault_sw_scope always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/javascript text/css application/json application/manifest+json image/svg+xml;
    client_max_body_size 8k;

    location = /api { return 404; }
    location ^~ /api/ { return 404; }
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        try_files $uri =404;
    }
    location / {
        try_files $uri $uri/ =404;
    }
}
